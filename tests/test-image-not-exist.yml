name: Test image does not exist (needs building)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - id: action
        uses: .
        with:
          base-image: nginx:1.21.0
          image: nginx:nonexistent
          platforms: linux/amd64
      - name: Assert needs-building is true
        env:
          ACTUAL: ${{ steps.action.outputs.needs-building }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "true" ]; then
            echo "FAIL: expected 'true'"
            exit 1
          fi
          echo "PASS"
      - name: Assert needs-updating is true
        env:
          ACTUAL: ${{ steps.action.outputs.needs-updating }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "true" ]; then
            echo "FAIL: expected 'true'"
            exit 1
          fi
          echo "PASS"
      - name: Assert diff-images is empty and diff-json is []
        env:
          IMAGES: ${{ steps.action.outputs.diff-images }}
          JSON: ${{ steps.action.outputs.diff-json }}
        run: |
          echo "diff-images: '$IMAGES'"
          echo "diff-json: $JSON"
          if [ -n "$IMAGES" ]; then
            echo "FAIL: expected empty diff-images"
            exit 1
          fi
          if [ "$JSON" != "[]" ]; then
            echo "FAIL: expected diff-json '[]'"
            exit 1
          fi
          echo "PASS"
