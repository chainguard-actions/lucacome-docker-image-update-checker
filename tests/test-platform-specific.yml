name: Test platform-specific check
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          base-image: nginx:1.25
          image: nginx:1.25
          platforms: linux/amd64
      - name: Assert outputs are set for platform-specific check
        env:
          NEEDS_UPDATING: ${{ steps.action.outputs.needs-updating }}
          NEEDS_BUILDING: ${{ steps.action.outputs.needs-building }}
          DIFF_JSON: ${{ steps.action.outputs.diff-json }}
        run: |
          echo "needs-updating: $NEEDS_UPDATING"
          echo "needs-building: $NEEDS_BUILDING"
          echo "diff-json: $DIFF_JSON"
          if [ -z "$NEEDS_UPDATING" ] && [ -z "$NEEDS_BUILDING" ]; then
            echo "FAIL: both needs-updating and needs-building are empty"
            exit 1
          fi
          echo "PASS: action produced output for platform-specific check"
