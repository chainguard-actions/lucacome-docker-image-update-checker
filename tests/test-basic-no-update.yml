name: Test basic - no update needed (same image)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # nginx:1.21.0 and library/nginx:1.21.0 are the same image (different notation)
      - id: action
        uses: .
        with:
          base-image: nginx:1.21.0
          image: library/nginx:1.21.0
          platforms: linux/amd64

      - name: Assert needs-updating is false
        env:
          NEEDS_UPDATING: ${{ steps.action.outputs.needs-updating }}
        run: |
          echo "needs-updating: $NEEDS_UPDATING"
          if [ "$NEEDS_UPDATING" != "false" ]; then
            echo "FAIL: expected needs-updating=false but got '$NEEDS_UPDATING'"
            exit 1
          fi
          echo "PASS"

      - name: Assert needs-building is false
        env:
          NEEDS_BUILDING: ${{ steps.action.outputs.needs-building }}
        run: |
          echo "needs-building: $NEEDS_BUILDING"
          if [ "$NEEDS_BUILDING" != "false" ]; then
            echo "FAIL: expected needs-building=false but got '$NEEDS_BUILDING'"
            exit 1
          fi
          echo "PASS"

      - name: Assert diff-json is empty array
        env:
          DIFF_JSON: ${{ steps.action.outputs.diff-json }}
        run: |
          echo "diff-json: $DIFF_JSON"
          if [ "$DIFF_JSON" != "[]" ]; then
            echo "FAIL: expected diff-json=[] but got '$DIFF_JSON'"
            exit 1
          fi
          echo "PASS"
