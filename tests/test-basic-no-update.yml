name: Test basic - no update needed (same image)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          base-image: nginx:latest
          image: nginx:latest
          platforms: linux/amd64
      - name: Assert needs-updating is false
        env:
          NEEDS_UPDATING: ${{ steps.action.outputs.needs-updating }}
          NEEDS_BUILDING: ${{ steps.action.outputs.needs-building }}
        run: |
          echo "needs-updating: $NEEDS_UPDATING"
          echo "needs-building: $NEEDS_BUILDING"
          if [ "$NEEDS_UPDATING" != "false" ]; then
            echo "FAIL: expected needs-updating to be 'false', got '$NEEDS_UPDATING'"
            exit 1
          fi
          if [ "$NEEDS_BUILDING" != "false" ]; then
            echo "FAIL: expected needs-building to be 'false', got '$NEEDS_BUILDING'"
            exit 1
          fi
          echo "PASS"
