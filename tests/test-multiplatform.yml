name: Test multi-platform check
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          base-image: alpine:3.18
          image: alpine:3.18
          platforms: linux/amd64,linux/arm64
      - name: Assert output is a boolean for multi-platform check
        env:
          NEEDS_UPDATING: ${{ steps.action.outputs.needs-updating }}
        run: |
          echo "needs-updating: $NEEDS_UPDATING"
          if [ "$NEEDS_UPDATING" != "true" ] && [ "$NEEDS_UPDATING" != "false" ]; then
            echo "FAIL: expected 'true' or 'false', got '$NEEDS_UPDATING'"
            exit 1
          fi
          echo "PASS: multi-platform check returned valid boolean: $NEEDS_UPDATING"
      - name: Assert no update needed when same image used for both platforms
        env:
          NEEDS_UPDATING: ${{ steps.action.outputs.needs-updating }}
        run: |
          echo "needs-updating: $NEEDS_UPDATING"
          if [ "$NEEDS_UPDATING" != "false" ]; then
            echo "FAIL: expected 'false' when image is same as base, got '$NEEDS_UPDATING'"
            exit 1
          fi
          echo "PASS: correctly reports no update needed for multi-platform"
