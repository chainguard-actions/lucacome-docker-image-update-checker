name: Test base image does not exist (error)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - id: action
        uses: .
        continue-on-error: true
        with:
          base-image: nginx:this-tag-does-not-exist-12345
          image: nginx:1.21.0
          platforms: linux/amd64
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          NEEDS_UPDATING: ${{ steps.action.outputs.needs-updating }}
        run: |
          echo "outcome: $OUTCOME"
          echo "needs-updating: '$NEEDS_UPDATING'"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for nonexistent base image"
            exit 1
          fi
          if [ -n "$NEEDS_UPDATING" ]; then
            echo "FAIL: expected no needs-updating output on failure"
            exit 1
          fi
          echo "PASS"
